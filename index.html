/* ---------- Paleta (mude aqui) ---------- */
:root{
  --ink:#1c2a3f;
  --muted:#586a82;
  --line:rgba(60,92,132,.18);
  --card:rgba(255,255,255,.66);
  --sky:#b7cce2;
  --mid:#d6e4f1;
  --snow:#f6f9fd;
  --accent:#ff5d45;          /* coral do fone do pinguim: só em pequenos destaques */
  --radius:20px;
  --maxw:1080px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

body{
  margin:0;
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink);
  background:var(--snow);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

/* ---------- Fundo: degradê céu → neve ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;
  background:linear-gradient(180deg,var(--sky) 0%,var(--mid) 38%,#eaf1f8 68%,var(--snow) 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(70px);transform:translateZ(0)}
.b1{width:60vw;height:38vh;left:-10vw;top:6vh;background:#fff;opacity:.55}
.b2{width:50vw;height:40vh;right:-12vw;top:34vh;background:#9db8d3;opacity:.38}

/* ---------- Topo ---------- */
.top{max-width:var(--maxw);margin:0 auto;padding:14px 20px 0;display:flex;align-items:center;justify-content:flex-end}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;font-weight:700;font-size:.95rem;letter-spacing:.01em}
.avatar{border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px rgba(255,255,255,.9),0 4px 12px -4px rgba(40,70,110,.4)}
.top nav{display:flex;gap:6px}
.top nav a{color:var(--muted);text-decoration:none;font-size:.9rem;padding:8px 14px;border-radius:999px;transition:color .2s,background-color .2s}
.top nav a:hover,.top nav a:focus-visible{color:var(--ink);background:rgba(255,255,255,.6)}

/* ---------- Hero ---------- */
.hero{max-width:var(--maxw);margin:0 auto;padding:clamp(10px,2.5vw,24px) 20px clamp(28px,4.5vw,48px);display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:clamp(104px,15vw,144px);height:clamp(104px,15vw,144px);border-radius:50%;object-fit:cover;box-shadow:0 0 0 4px rgba(255,255,255,.85),0 18px 36px -14px rgba(40,70,110,.55)}
h1{margin:22px 0 0;font-weight:700;font-size:clamp(1.9rem,5.6vw,3.5rem);line-height:1.1;letter-spacing:-.025em;color:var(--ink);overflow-wrap:anywhere}
.tagline{margin:10px 0 0;color:var(--muted);font-size:clamp(.95rem,1.8vw,1.1rem)}

/* ---------- Shorts (vertical) ---------- */
.sec-label{margin:0 0 14px;text-align:center;font-size:.78rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.sec-label-2{margin-top:clamp(30px,4.5vw,48px)}
.shorts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2.2vw,26px);max-width:780px;margin:0 auto}
.shorts .thumb{aspect-ratio:9/16}
.shorts .thumb.empty{aspect-ratio:9/16}

/* ---------- Grade 2x2 ---------- */
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2.2vw,26px)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px;
  box-shadow:0 14px 30px -22px rgba(40,70,110,.55);contain:layout paint;transition:transform .25s ease,box-shadow .25s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 20px 34px -22px rgba(40,70,110,.6)}

.thumb{position:relative;display:block;width:100%;aspect-ratio:16/9;border:0;padding:0;margin:0;border-radius:12px;overflow:hidden;
  background:linear-gradient(135deg,#c5d6e8,#dfe9f4);cursor:pointer;font:inherit;color:inherit}
.thumb img,.thumb iframe,.thumb video{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover;background:#0f1724}
.thumb img{transition:transform .4s ease}
.card:hover .thumb img{transform:scale(1.03)}
.thumb.is-playing{cursor:default}
.thumb.is-playing video{object-fit:contain}
.thumb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.play{position:absolute;left:50%;top:50%;width:clamp(44px,7vw,64px);height:clamp(44px,7vw,64px);margin:calc(clamp(44px,7vw,64px)/-2) 0 0 calc(clamp(44px,7vw,64px)/-2);
  display:grid;place-items:center;border-radius:50%;background:var(--accent);color:#fff;box-shadow:0 8px 20px -6px rgba(214,61,40,.7);transition:transform .2s ease}
.play svg{width:46%;height:46%;margin-left:6%}
.card:hover .play{transform:scale(1.08)}

.thumb.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:default;border:1px dashed rgba(60,92,132,.35);background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(200,217,234,.55))}
.empty-n{font-weight:700;font-size:clamp(1.6rem,4vw,2.6rem);color:rgba(60,92,132,.45);letter-spacing:-.02em}
.empty-t{font-size:.85rem;color:var(--muted)}

.cap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 6px 4px}
.cap h3{margin:0;font-size:clamp(.88rem,1.5vw,1rem);font-weight:700;letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{flex:none;font-size:.72rem;color:var(--muted);background:rgba(255,255,255,.75);border:1px solid var(--line);padding:3px 10px;border-radius:999px}

/* ---------- Contato ---------- */
.contact{padding-top:clamp(40px,7vw,80px);padding-bottom:clamp(36px,6vw,64px)}
.contact h2{margin:0 0 16px;font-size:clamp(1.3rem,2.6vw,1.7rem);font-weight:700;letter-spacing:-.015em}
.contact-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,20px)}
.social{display:flex;align-items:center;gap:14px;min-width:0;width:100%;text-align:left;font:inherit;color:inherit;text-decoration:none;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 10px 24px -20px rgba(40,70,110,.6);
  transition:transform .18s ease,box-shadow .18s ease,background-color .18s ease,border-color .18s ease}
.social:hover{transform:translateY(-3px);background:#fff;border-color:rgba(60,92,132,.32);box-shadow:0 16px 28px -18px rgba(40,70,110,.65)}
.social:active{transform:translateY(0) scale(.97);box-shadow:0 6px 14px -12px rgba(40,70,110,.6);transition-duration:.08s}
.social:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.s-icon{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:rgba(60,92,132,.1);color:var(--ink);
  transition:transform .18s ease,background-color .18s ease,color .18s ease}
.s-icon svg{width:24px;height:24px}
.social:hover .s-icon{transform:scale(1.1) rotate(-4deg);background:var(--ink);color:#fff}
.s-text{display:flex;flex-direction:column;min-width:0;flex:1}
.s-label{font-size:.72rem;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.s-value{font-weight:700;font-size:.92rem;line-height:1.3;overflow-wrap:anywhere}
.s-hint{flex:none;font-size:.78rem;font-weight:700;color:var(--muted);transition:color .18s ease,transform .18s ease}
.social:hover .s-hint{color:var(--ink);transform:translateX(2px)}

.foot{max-width:var(--maxw);margin:0 auto;padding:8px 20px 36px;color:var(--muted);font-size:.8rem;text-align:center}

/* ---------- Telas menores ---------- */
@media (max-width:820px){
  .contact-grid{grid-template-columns:1fr}
}
@media (max-width:640px){

  <script>
(function () {
  "use strict";
  var C = window.PORTFOLIO || {};
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- Nome, título e rodapé ---------- */
  var name = (C.name || "Your name").trim();
  var role = (C.role || "Video Editor").trim();
  var heading = name + " | " + role;
  $("nome").textContent = heading;
  if (C.tagline) $("tagline").textContent = C.tagline;
  document.title = heading;
  $("foot").textContent = "© " + new Date().getFullYear() + " " + name;

  /* ---------- Vídeos ---------- */
  function ytId(v) {
    if (!v) return "";
    v = String(v).trim();
    if (/^[\w-]{11}$/.test(v)) return v;
    var m = v.match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/);
    return m ? m[1] : "";
  }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  var playSvg =
    '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.8v10.4a.6.6 0 0 0 .9.5l8.3-5.2a.6.6 0 0 0 0-1L9.9 6.3a.6.6 0 0 0-.9.5z" fill="currentColor"/></svg>';

  function mountPlayer(box, v, id) {
    box.textContent = "";
    box.classList.add("is-playing");
    if (id) {
      var f = document.createElement("iframe");
      f.src = "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0&modestbranding=1";
      f.title = v.title || "Video";
      f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
      f.allowFullscreen = true;
      f.referrerPolicy = "strict-origin-when-cross-origin";
      box.appendChild(f);
    } else {
      var vid = document.createElement("video");
      vid.src = v.file;
      vid.controls = true;
      vid.autoplay = true;
      vid.playsInline = true;
      if (v.poster) vid.poster = v.poster;
      box.appendChild(vid);
    }
  }

  function render(list, mount, max) {
  (list || []).slice(0, max).forEach(function (v, i) {
    var id = ytId(v.youtube);
    var hasSource = !!(id || v.file);
    var card = el("article", "card");
    var box;

    if (hasSource) {
      box = el("button", "thumb");
      box.type = "button";
      box.setAttribute("aria-label", "Play: " + (v.title || "video " + (i + 1)));
      var src = v.poster || (id ? "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg" : "");
      if (src) {
        var img = document.createElement("img");
        img.src = src;
        img.alt = "";
        img.loading = i < 2 ? "eager" : "lazy";
        img.decoding = "async";
        box.appendChild(img);
      } else {
        box.classList.add("no-img");
      }
      var play = el("span", "play");
      play.innerHTML = playSvg;
      box.appendChild(play);
      box.addEventListener("click", function () { mountPlayer(box, v, id); }, { once: true });
    } else {
      box = el("div", "thumb empty");
      var n = el("span", "empty-n", String(i + 1).padStart(2, "0"));
      var t = el("span", "empty-t", "Your video here");
      box.appendChild(n);
      box.appendChild(t);
    }

    var cap = el("div", "cap");
    cap.appendChild(el("h3", "", v.title || "Video " + (i + 1)));
    if (v.tag) cap.appendChild(el("span", "tag", v.tag));
    card.appendChild(box);
    card.appendChild(cap);
    mount.appendChild(card);
  });
  }
  render(C.shorts, $("shorts"), 3);
  render(C.videos, $("grid"), 4);

  /* ---------- Contatos ---------- */
  var ct = C.contacts || {};
  var discord = (ct.discord || "").trim();
  var email = (ct.email || "").trim();
  var tw = (ct.twitter || "").trim();

  $("c-discord").textContent = discord;
  $("c-email").textContent = email;

  var handle = tw.replace(/^https?:\/\/(www\.)?(x|twitter)\.com\//i, "").replace(/^@/, "").replace(/[/?#].*$/, "");
  $("c-twitter").textContent = handle ? "@" + handle : "";
  $("open-twitter").href = "https://x.com/" + encodeURIComponent(handle);
  $("open-email").href = "mailto:" + email;

  var copyBtn = $("copy-discord");
  var hint = $("hint-discord");
  copyBtn.addEventListener("click", function () {
    var done = function () {
      hint.textContent = "Copied!";
      setTimeout(function () { hint.textContent = "Copy"; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(discord).then(done, done);
    } else {
      var ta = document.createElement("textarea");
      ta.value = discord;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done();
    }
  });
})();

  </script>
